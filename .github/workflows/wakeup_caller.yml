name: Poranny Budzik Aplikacji

on:
  schedule:
    # cron: 'MINUTY GODZINY * * DNI_TYGODNIA' 
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Pozwala odpalić ręcznie z panelu

jobs:
  run-budzik:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v3

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          pip install playwright
          playwright install chromium

      - name: Odpal budzik
        run: python wakeup_caller.py
